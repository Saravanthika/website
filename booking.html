<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Booking — TONI&amp;GUY R.S. Puram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #0c0c0d;
      --bg-card: #121214;
      --bg-pill: #151518;
      --border-subtle: rgba(212, 175, 55, 0.22);
      --border-pill: rgba(255, 255, 255, 0.14);
      --gold: #d6b36a;
      --gold-bright: #e5c682;
      --text-main: #f5f3ee;
      --text-muted: #9e9a92;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 18px 64px;
    }

    .booking-wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .header-block {
      text-align: center;
      margin-bottom: 34px;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 10px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.1rem, 4.5vw, 3.25rem);
      line-height: 1.1;
      margin: 0 0 12px;
      color: #ffffff;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 560px;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .booking-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .step-section {
      margin-bottom: 28px;
    }

    .step-label {
      font-size: 0.74rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px;
      font-weight: 600;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-tab-btn {
      background: #19191d;
      color: var(--text-muted);
      border: 1px solid rgba(214, 179, 106, 0.25);
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-tab-btn:hover,
    .cat-tab-btn.active {
      background: rgba(214, 179, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold-bright);
    }

    .option-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option-btn {
      background: var(--bg-pill);
      color: #e6e3dc;
      border: 1px solid var(--border-pill);
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.86rem;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--gold);
      color: #ffffff;
    }

    .option-btn.selected {
      background: rgba(214, 179, 106, 0.16);
      border-color: var(--gold);
      color: var(--gold-bright);
      font-weight: 600;
    }

    .helper-text {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin: 4px 0 0;
    }

    .details-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .field-input {
      width: 100%;
      background: #141417;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      padding: 13px 15px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field-input::placeholder {
      color: #7c7870;
    }

    .field-input:focus {
      border-color: var(--gold);
    }

    .actions-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #dfbe78, #c59e50);
      color: #12100b;
      border: none;
      padding: 15px 20px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .btn-gold:hover {
      filter: brightness(1.06);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid rgba(214, 179, 106, 0.45);
      padding: 15px 20px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .btn-outline:hover {
      border-color: var(--gold);
      background: rgba(214, 179, 106, 0.08);
    }

    .error-msg {
      color: #f08080;
      font-size: 0.84rem;
      margin-top: 10px;
      min-height: 20px;
    }

    @media (max-width: 680px) {
      .booking-panel {
        padding: 22px 16px;
      }

      .details-row,
      .actions-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="booking-wrap">
    <div class="top-bar">
      <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <header class="header-block">
      <p class="eyebrow">Instant Booking</p>
      <h1>Pick your slot in 30 seconds</h1>
      <p class="subtitle">Choose a service, date and time. We&rsquo;ll send your request straight to the salon on WhatsApp for confirmation.</p>
    </header>

    <section class="booking-panel" aria-label="Instant Appointment Booking">
      <!-- 1. Choose a Service -->
      <div class="step-section">
        <p class="step-label">1 &middot; Choose a Service</p>

        <div class="category-tabs" id="categoryTabs">
          <button type="button" class="cat-tab-btn active" data-group="hair">Hair Services</button>
          <button type="button" class="cat-tab-btn" data-group="skin">Skin Services</button>
          <button type="button" class="cat-tab-btn" data-group="makeup">Make Up Services</button>
          <button type="button" class="cat-tab-btn" data-group="chemical">Chemical Treatments</button>
        </div>

        <div class="option-grid" id="serviceOptions"></div>
      </div>

      <!-- 2. Choose a Date -->
      <div class="step-section">
        <p class="step-label">2 &middot; Choose a Date</p>
        <div class="option-grid" id="dateOptions"></div>
      </div>

      <!-- 3. Choose a Time -->
      <div class="step-section">
        <p class="step-label">3 &middot; Choose a Time</p>
        <p class="helper-text" id="timeHelper">Select a date first</p>
        <div class="option-grid" id="timeOptions" style="display: none;"></div>
      </div>

      <!-- 4. Your Details -->
      <div class="step-section" style="margin-bottom: 0;">
        <p class="step-label">4 &middot; Your Details</p>
        <div class="details-row">
          <input type="text" id="customerName" class="field-input" placeholder="Full name *" required />
          <input type="tel" id="customerPhone" class="field-input" placeholder="Mobile number *" required />
        </div>
        <input type="text" id="customerNotes" class="field-input" placeholder="Anything we should know? (optional)" />
        <p class="error-msg" id="formError" role="alert"></p>

        <div class="actions-row">
          <button type="button" class="btn-gold" id="confirmWhatsappBtn">Confirm Booking on WhatsApp</button>
          <a href="tel:+919500839097" class="btn-outline">&#9742; Prefer to Call?</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const WHATSAPP_NUMBER = "919500839097";

      const SERVICE_CATALOG = {
        hair: [
          "Haircut",
          "Signature Cut",
          "Hair Mens",
          "Men's Style",
          "Hairstyling",
          "Blow dry",
          "Signature Blow Dry",
          "Shampoo & conditioning",
          "Hair extensions",
          "Face Framing",
          "Hair Texture",
          "Afro Textured Hair",
          "Beach Wave",
          "Hair Up",
          "Party Hair",
          "Wedding Hair",
          "Hair & Scalp",
          "Hair Treatment",
          "Hairspa Treatment",
          "Hair Salons",
          "Hairdressing Salons",
          "Hair And Fashion"
        ],
        skin: [
          "Facials",
          "Skin care",
          "Manicure",
          "Pedicure",
          "Waxing",
          "Body waxing",
          "Eyebrow threading",
          "Eyebrow hair removal",
          "Eyebrow beautification",
          "Hair threading"
        ],
        makeup: [
          "Make-up",
          "Make-up services",
          "Bridal services",
          "Wedding Day",
          "Wedding and event preparation",
          "Special Occasion",
          "Touch Up"
        ],
        chemical: [
          "Hair Colour",
          "Signature Colour",
          "Full Head Colour",
          "Cut And Colour",
          "Colour Packages",
          "Signature Balayage",
          "Signature Highlights",
          "Keratin Smoothing",
          "Keratin treatments",
          "Plex Treatment",
          "Hair Straightener"
        ]
      };

      const TIME_SLOTS = [
        "10:30 AM", "11:30 AM", "12:30 PM",
        "2:00 PM", "3:30 PM", "5:00 PM",
        "6:30 PM", "7:30 PM"
      ];

      let activeCategory = "hair";
      let selectedService = "";
      let selectedDateLabel = "";
      let selectedTime = "";

      const categoryTabs = document.querySelectorAll("#categoryTabs .cat-tab-btn");
      const serviceContainer = document.getElementById("serviceOptions");
      const dateContainer = document.getElementById("dateOptions");
      const timeHelper = document.getElementById("timeHelper");
      const timeContainer = document.getElementById("timeOptions");
      const nameInput = document.getElementById("customerName");
      const phoneInput = document.getElementById("customerPhone");
      const notesInput = document.getElementById("customerNotes");
      const errorEl = document.getElementById("formError");
      const confirmBtn = document.getElementById("confirmWhatsappBtn");

      function renderServices(groupKey) {
        serviceContainer.innerHTML = "";
        const items = SERVICE_CATALOG[groupKey] || [];
        items.forEach((serviceName) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.textContent = serviceName;
          btn.dataset.service = serviceName;

          if (selectedService === serviceName) {
            btn.classList.add("selected");
          }

          btn.addEventListener("click", () => {
            serviceContainer.querySelectorAll(".option-btn").forEach((b) => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedService = serviceName;
            errorEl.textContent = "";
          });

          serviceContainer.appendChild(btn);
        });
      }

      categoryTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          categoryTabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          activeCategory = tab.dataset.group;
          renderServices(activeCategory);
        });
      });

      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      function buildWeekDates() {
        const now = new Date();
        for (let i = 0; i < 7; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() + i);

          let label;
          if (i === 0) {
            label = "Today";
          } else if (i === 1) {
            label = "Tomorrow";
          } else {
            label = `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]}`;
          }

          const fullDateText = `${label} (${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()})`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.textContent = label;
          btn.dataset.fullDate = fullDateText;

          btn.addEventListener("click", () => {
            dateContainer.querySelectorAll(".option-btn").forEach((b) => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedDateLabel = btn.dataset.fullDate;
            errorEl.textContent = "";
            renderTimeSlots();
          });

          dateContainer.appendChild(btn);
        }
      }

      function renderTimeSlots() {
        selectedTime = "";
        timeHelper.style.display = "none";
        timeContainer.style.display = "flex";
        timeContainer.innerHTML = "";

        TIME_SLOTS.forEach((slot) => {
          const slotBtn = document.createElement("button");
          slotBtn.type = "button";
          slotBtn.className = "option-btn";
          slotBtn.textContent = slot;

          slotBtn.addEventListener("click", () => {
            timeContainer.querySelectorAll(".option-btn").forEach((b) => b.classList.remove("selected"));
            slotBtn.classList.add("selected");
            selectedTime = slot;
            errorEl.textContent = "";
          });

          timeContainer.appendChild(slotBtn);
        });
      }

      confirmBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const notes = notesInput.value.trim();

        if (!selectedService) {
          errorEl.textContent = "Please select a service first.";
          return;
        }
        if (!selectedDateLabel) {
          errorEl.textContent = "Please choose a date.";
          return;
        }
        if (!selectedTime) {
          errorEl.textContent = "Please choose a time slot.";
          return;
        }
        if (!name || !phone) {
          errorEl.textContent = "Please enter your full name and mobile number.";
          return;
        }

        const lines = [
          "Hello TONI&GUY R.S. Puram, I would like to book an appointment:",
          `Service: ${selectedService}`,
          `Date: ${selectedDateLabel}`,
          `Time: ${selectedTime}`,
          `Name: ${name}`,
          `Mobile: ${phone}`
        ];
        if (notes) {
          lines.push(`Notes: ${notes}`);
        }

        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
        window.open(waUrl, "_blank", "noopener,noreferrer");
      });

      renderServices(activeCategory);
      buildWeekDates();
    })();
  </script>
</body>
</html>
